metrics:

  - name: agg_daily_lineitem_quantity
    display_name: "Daily aggregates for line items by part and supplier"
    layer: gold
    grain: daily
    source_fact: fct_lineitem
    refresh_frequency: "Depends on dbt schedule (typically daily)"
    
    measures:

      - name: total_quantity
        aggregation: SUM
        source_column: l_quantity
        data_type: "NUMERIC"
        description: Sum of line quantities per day
        sql_formula: "SUM(l_quantity)"
        null_handling: "NULLs are excluded from aggregations"
        use_cases:

          - "Analyze total_quantity trends"
          - "Compare across time periods"

        example_queries:
          - description: "Get total_quantity for last 30 days"
            sql: "SELECT daily_date, total_quantity FROM agg_daily_lineitem_quantity WHERE daily_date >= CURRENT_DATE - 30 ORDER BY daily_date"
          - description: "Compare total_quantity month-over-month"
            sql: "SELECT daily_date, total_quantity, LAG(total_quantity) OVER (ORDER BY daily_date) as previous_period FROM agg_daily_lineitem_quantity"

      - name: avg_quantity
        aggregation: AVG
        source_column: l_quantity
        data_type: "NUMERIC"
        description: Average line quantity per day
        sql_formula: "AVG(l_quantity)"
