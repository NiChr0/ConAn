## Facts (Measurable Events)
facts:

  - name: fct_lineitem
    display_name: "Lineitem"
    source_table: lineitem
    grain: one row per line item
    description: "Transactional data capturing measurable events"
    
    date_column: l_shipdate
    date_description: "Primary date for time-based analysis"
    
    measures:

      - name: l_quantity
        type: "Numeric - can be aggregated"
        typical_aggregations: [SUM, AVG, MIN, MAX, COUNT]

      - name: l_extendedprice
        type: "Numeric - can be aggregated"
        typical_aggregations: [SUM, AVG, MIN, MAX, COUNT]

      - name: l_discount
        type: "Numeric - can be aggregated"
        typical_aggregations: [SUM, AVG, MIN, MAX, COUNT]

      - name: l_tax
        type: "Numeric - can be aggregated"
        typical_aggregations: [SUM, AVG, MIN, MAX, COUNT]


      - name: line_total
        type: "Derived - computed as: l_extendedprice * (1 - l_discount)"
        typical_aggregations: [SUM, AVG, MIN, MAX]

      - name: net_revenue
        type: "Derived - computed as: l_extendedprice * (1 - l_discount) * (1 - l_tax)"
        typical_aggregations: [SUM, AVG, MIN, MAX]


    dimension_keys:

      - l_orderkey

      - l_partkey

      - l_suppkey



    relationships:










    
    typical_use_cases:
      - "Detailed transaction-level analysis"
      - "Calculate custom metrics not available in Gold"
      - "Drill down from Gold aggregates"
    
    join_pattern: |
      SELECT 
        f.*,

        d_1.attribute_name

        d_2.attribute_name

        d_3.attribute_name

      FROM fct_lineitem f










      WHERE f.l_shipdate >= CURRENT_DATE - 30


