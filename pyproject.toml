[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conan"
version = "0.1.0"
description = "AI analytics partner for Schemalytics projects."
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "instructor>=1.0",
    "openai>=1.0",
    "anthropic>=0.40",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.0"]

[project.scripts]
conan = "conan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["conan"]
